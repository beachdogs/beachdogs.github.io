<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14343d" />
      <stop offset="100%" stop-color="#0c1f26" />
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4c55e" />
      <stop offset="100%" stop-color="#d89a12" />
    </linearGradient>
    <linearGradient id="coral2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f76f5f" />
      <stop offset="100%" stop-color="#e95d4d" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg2)" />

  <!-- Ambient light -->
  <circle cx="400" cy="180" r="220" fill="#f4c55e" opacity="0.1" />

  <!-- Podium / Leaderboard Card Container -->
  <g transform="translate(180, 60)">
    <rect width="440" height="330" rx="24" fill="#173842" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

    <!-- Header bar -->
    <rect x="0" y="0" width="440" height="60" rx="24" fill="#1b4450" />
    <text x="30" y="37" fill="#76e1d3" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="2">WEEKLY RIVALRY LEADERBOARD</text>
    <rect x="340" y="20" width="70" height="22" rx="11" fill="url(#coral2)" />
    <text x="375" y="35" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">LIVE RESET</text>

    <!-- Rank 1 Row -->
    <g transform="translate(24, 80)">
      <rect width="392" height="64" rx="14" fill="#204d59" stroke="#f4c55e" stroke-width="2" />
      <!-- Rank gold badge -->
      <circle cx="36" cy="32" r="16" fill="url(#gold2)" />
      <text x="36" y="37" fill="#102832" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle">1</text>
      <!-- Crown icon -->
      <polygon points="36,10 42,18 48,14 44,22 28,22 24,14 30,18" fill="#f4c55e" />
      
      <text x="68" y="30" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">Sarah M. (Champion)</text>
      <text x="68" y="47" fill="#76e1d3" font-family="sans-serif" font-size="11" font-weight="bold">DEFENDING #1 SPOT • PACIFICA</text>
      
      <rect x="300" y="18" width="76" height="28" rx="8" fill="#102832" />
      <text x="338" y="36" fill="#f4c55e" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">3,450 pts</text>
    </g>

    <!-- Rank 2 Row -->
    <g transform="translate(24, 156)">
      <rect width="392" height="56" rx="14" fill="#1b414d" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <circle cx="36" cy="28" r="14" fill="#d4e1df" />
      <text x="36" y="33" fill="#102832" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">2</text>
      <text x="68" y="27" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Jordan K.</text>
      <text x="68" y="43" fill="rgba(255,255,255,0.45)" font-family="sans-serif" font-size="10">Challenging for lead</text>
      <text x="350" y="34" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">3,120 pts</text>
    </g>

    <!-- Rank 3 Row -->
    <g transform="translate(24, 224)">
      <rect width="392" height="56" rx="14" fill="#1b414d" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <circle cx="36" cy="28" r="14" fill="#d99878" />
      <text x="36" y="33" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">3</text>
      <text x="68" y="27" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Alex T.</text>
      <text x="68" y="43" fill="rgba(255,255,255,0.45)" font-family="sans-serif" font-size="10">Speed run record</text>
      <text x="350" y="34" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">2,980 pts</text>
    </g>
  </g>
</svg>
