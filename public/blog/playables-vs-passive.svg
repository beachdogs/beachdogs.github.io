<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#173842" />
      <stop offset="100%" stop-color="#102832" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f76f5f" />
      <stop offset="100%" stop-color="#e95d4d" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4c55e" />
      <stop offset="100%" stop-color="#d89a12" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Background Glows -->
  <circle cx="650" cy="120" r="180" fill="#76e1d3" opacity="0.12" filter="url(#glow)" />
  <circle cx="150" cy="350" r="160" fill="#f76f5f" opacity="0.16" filter="url(#glow)" />

  <!-- Subtle grid lines -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Left: Dull Boring Static Ad Box -->
  <g transform="translate(120, 110)">
    <rect width="220" height="230" rx="18" fill="#1b414d" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
    <rect x="25" y="30" width="80" height="12" rx="6" fill="rgba(255,255,255,0.2)" />
    <rect x="25" y="55" width="170" height="90" rx="10" fill="rgba(255,255,255,0.08)" />
    <text x="110" y="105" fill="rgba(255,255,255,0.3)" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">STATIC AD</text>
    <rect x="25" y="160" width="130" height="8" rx="4" fill="rgba(255,255,255,0.18)" />
    <rect x="25" y="176" width="90" height="8" rx="4" fill="rgba(255,255,255,0.18)" />
    <rect x="25" y="196" width="60" height="16" rx="8" fill="rgba(255,255,255,0.25)" />
    <text x="110" y="270" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">1.4s attention span</text>
  </g>

  <!-- VS circle -->
  <circle cx="400" cy="225" r="26" fill="#f4c55e" />
  <text x="400" y="232" fill="#102832" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="middle">VS</text>

  <!-- Right: Playable Interactive Experience -->
  <g transform="translate(460, 95)">
    <rect width="230" height="260" rx="22" fill="#204d59" stroke="#76e1d3" stroke-width="2" filter="drop-shadow(0 14px 30px rgba(0,0,0,0.3))" />
    
    <!-- Top badge -->
    <rect x="20" y="22" width="70" height="18" rx="9" fill="url(#coralGrad)" />
    <text x="55" y="34" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="800" text-anchor="middle">PLAYABLE</text>
    
    <!-- Mini score screen -->
    <rect x="20" y="52" width="190" height="120" rx="14" fill="#102832" />
    <circle cx="115" cy="100" r="28" fill="url(#coralGrad)" />
    <polygon points="110,88 126,100 110,112" fill="#ffffff" />
    
    <!-- Tap sparks -->
    <circle cx="70" cy="85" r="4" fill="#f4c55e" />
    <circle cx="160" cy="120" r="5" fill="#76e1d3" />
    
    <!-- Progress bar -->
    <rect x="20" y="190" width="190" height="10" rx="5" fill="rgba(255,255,255,0.12)" />
    <rect x="20" y="190" width="145" height="10" rx="5" fill="#76e1d3" />
    
    <text x="20" y="224" fill="#f4c55e" font-family="sans-serif" font-size="12" font-weight="800">148s AVERAGE PLAYTIME</text>
  </g>
</svg>
